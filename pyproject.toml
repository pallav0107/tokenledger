[project]
name = "tokenledger-llm"
version = "0.2.0"
description = "Measure the real cost structure of multi-agent / multi-model LLM systems from request logs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pallav Pokhriyal" }]
keywords = ["llm", "agents", "cost", "tokens", "observability", "mlops"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pallav0107/tokenledger"
Source = "https://github.com/pallav0107/tokenledger"
Issues = "https://github.com/pallav0107/tokenledger/issues"
Methodology = "https://github.com/pallav0107/tokenledger/blob/main/docs/METHODOLOGY.md"

[project.scripts]
tokenledger = "tokenledger.report:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4"]

[tool.setuptools]
packages = ["tokenledger"]

[tool.setuptools.package-data]
tokenledger = ["py.typed", "tools.json", "AGENTS.md", "llms.txt", "schemas/*.json"]
